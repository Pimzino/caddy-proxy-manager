name: windows-tests

# Runs one test project (optionally filtered) on windows-latest and uploads the results: a quick way to diagnose a
# Windows-only failure without the full build (about 5 minutes instead of 25). Start it from the Actions tab or with
#   gh workflow run windows-tests.yml -f project=tests/CaddyManager.Telemetry.Tests -f filter="FullyQualifiedName~X"
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Test project folder, e.g. tests/CaddyManager.Telemetry.Tests'
        required: true
        default: 'tests/CaddyManager.Telemetry.Tests'
      filter:
        description: 'dotnet test --filter expression (empty = all tests of the project)'
        required: false
        default: ''
      e2e_tools:
        description: 'Also download Pebble and the Caddy plugin builds (Config/Cluster E2E tests)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Tests (${{ inputs.project }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Caddy for integration tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-caddy.ps1 -Which tested

      - name: Download E2E tools
        if: ${{ inputs.e2e_tools }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-e2e-tools.ps1

      - name: Test
        shell: pwsh
        env:
          CPM_E2E_ARTIFACTS: ${{ github.workspace }}/TestResults/e2e
          CPM_E2E_NO_DOWNLOAD: '1'
          FILTER: ${{ inputs.filter }}
          PROJECT: ${{ inputs.project }}
        run: |
          $name = Split-Path $env:PROJECT -Leaf
          $args = @("$env:PROJECT/$name.csproj", '-c', 'Release', '--logger', 'trx', '--results-directory', 'TestResults', '--nologo')
          if ($env:FILTER) { $args += @('--filter', $env:FILTER) }
          dotnet test @args

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: TestResults/**
          retention-days: 7
