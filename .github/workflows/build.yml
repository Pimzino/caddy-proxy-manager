name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  test:
    name: Tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Python + aioquic for the HTTP/3 0-RTT end-to-end test (TlsE2ETests): .NET's QUIC client (msquic) cannot send 0-RTT
      # early data, so the test drives Caddy with aioquic and skips itself without CPM_AIOQUIC_PYTHON. aioquic 1.3.0 ships
      # abi3 win_amd64 wheels (https://pypi.org/project/aioquic/1.3.0/#files); it is the version the test was verified with.
      # setup-python v7: https://github.com/actions/setup-python/releases/tag/v7.0.0 (output python-path).
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: '3.13'

      - name: Install aioquic (HTTP/3 0-RTT test client)
        shell: pwsh
        run: |
          & '${{ steps.py.outputs.python-path }}' -m pip install --disable-pip-version-check --no-input 'aioquic==1.3.0'
          if ($LASTEXITCODE -ne 0) { throw 'pip install aioquic failed.' }
          & '${{ steps.py.outputs.python-path }}' -c "import aioquic, sys; print('aioquic', aioquic.__version__, 'on Python', sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'aioquic does not import.' }

      - name: Web UI — install, typecheck, lint, build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      # The Config/Platform suites run real-Caddy integration tests when .dev/bin/caddy.exe exists. They must run against
      # the Caddy release the product is verified with (CaddyVersion.Tested), not whatever is "latest" today: Caddy changes
      # behaviour between minor versions (v2.11.0 changed the Host header sent to HTTPS upstreams). The job "caddy-latest"
      # below runs the same suites against the newest release, without blocking the build.
      - name: Download Caddy for integration tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-caddy.ps1 -Which tested

      # Pebble (test ACME CA, digest-verified) and Caddy CaddyVersion.Tested built with caddy-dns/rfc2136 + cloudflare for
      # the DNS-01 issuance and secret-scrubbing E2E tests (Config). The tests never download on CI (CPM_E2E_NO_DOWNLOAD).
      - name: Download E2E tools (Pebble, Caddy with caddy-dns)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-e2e-tools.ps1

      - name: .NET tests
        shell: pwsh
        # -m:1 runs the test projects one after another: several suites start real Caddy processes on dynamic ports.
        # The runner is elevated: the Windows-only suites (real SCM, firewall, Event Log, DPAPI, WinHTTP) run here.
        env:
          # End-to-end tests write verifiable artifacts here (e.g. the HTTP/3 upstream framing report).
          CPM_E2E_ARTIFACTS: ${{ github.workspace }}/TestResults/e2e
          # Runs the HTTP/3 0-RTT test (allow_0rtt=false and the QUIC listener release before loading). The HTTP/3 tests
          # use the msquic that .NET ships on Windows (QuicConnection.IsSupported: Windows 11 / Server 2022 or later).
          CPM_AIOQUIC_PYTHON: ${{ steps.py.outputs.python-path }}
          # The E2E tools come from the step above; a missing tool makes its test skip, which the gate below fails.
          CPM_E2E_NO_DOWNLOAD: '1'
        run: dotnet test CaddyManager.sln -c Release -m:1 --filter "Category!=Network" --logger "trx" --results-directory TestResults --nologo

      # The E2E tests skip themselves when a prerequisite is missing (aioquic, msquic, Windows, elevation). On this runner
      # every one of them must really run: fail the build when a required test was skipped or is missing, or a required
      # artifact was not written. Writes TestResults/e2e/e2e-required.json (uploaded below) and a job-summary table.
      - name: Required end-to-end tests ran
        if: success() || failure()
        shell: pwsh
        run: |
          ./.github/scripts/assert-e2e-ran.ps1 -ResultsDirectory TestResults -ArtifactsDirectory TestResults/e2e -RequiredTests @(
            'CaddyManager.Config.Tests.TlsE2ETests.Http3_resumed_requests_on_ip_restricted_hosts_never_get_425'
            'CaddyManager.Config.Tests.Http3UpstreamE2ETests.*'
            'CaddyManager.Config.Tests.WindowsCertificateStoreE2ETests.*'
            'CaddyManager.Config.Tests.Dns01IssuanceE2ETests.*'
            'CaddyManager.Config.Tests.TrafficStatsLogE2ETests.*'
            'CaddyManager.Config.Tests.SharedStorageE2ETests.*'
            'CaddyManager.Config.Tests.SecretScrubE2ETests.*'
            'CaddyManager.Config.Tests.DnsDelegationE2ETests.*'
            'CaddyManager.Platform.Tests.CaddyServiceStartPendingE2ETests.*'
            'CaddyManager.Platform.Tests.WindowsPlatformE2ETests.*'
            'CaddyManager.Platform.Tests.WindowsServiceManagerTests.*'
            'CaddyManager.Platform.Tests.ReadinessWindowsTests.*'
            'CaddyManager.Platform.Tests.CaddyPinE2ETests.*'
            'CaddyManager.Platform.Tests.GetCaddyScriptE2ETests.*'
            'CaddyManager.Platform.Tests.AssertE2eRanScriptE2ETests.*'
            'CaddyManager.Ops.Tests.WindowsOpsE2ETests.*'
            'CaddyManager.Telemetry.Tests.TrafficIngestE2ETests.*'
            'CaddyManager.Telemetry.Tests.ResourceSamplerE2ETests.*'
            'CaddyManager.Cluster.Tests.ClusterE2ETests.*'
            'CaddyManager.Cluster.Tests.ClusterPushE2ETests.*'
            'CaddyManager.Cluster.Tests.ClusterHttpsPinE2ETests.*'
            'CaddyManager.Cluster.Tests.FullStackTrafficE2ETests.*'
            'CaddyManager.Cluster.Tests.BackgroundServicesE2ETests.*'
          ) -RequiredArtifacts @(
            'http3-0rtt-ip-access-list.json'
            'http3-upstream-framing.json'
            'windows-certificate-store-export.json'
            'dns01-issuance.json'
            'stats-log.json'
            'shared-storage.json'
            'secret-scrub.json'
            'dns01-delegation.json'
            'caddy-service-start-pending.json'
            'caddy-service-real-cycles.json'
            'caddy-pin.json'
            'traffic-ingest.json'
            'resource-samples.json'
            'cluster-e2e.json'
            'cluster-push-e2e.json'
            'cluster-https-pin-e2e.json'
            'full-stack-traffic.json'
            'background-services.json'
          )

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $total = 0; $passed = 0; $failed = 0; $skipped = 0
          $lines = @('| Suite | Passed | Failed | Skipped |', '|---|---:|---:|---:|')
          foreach ($trx in Get-ChildItem -LiteralPath TestResults -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$x = Get-Content -LiteralPath $trx.FullName -Raw
            $c = $x.TestRun.ResultSummary.Counters
            $suite = ($x.TestRun.TestDefinitions.UnitTest | Select-Object -First 1).TestMethod.className -replace '^(CaddyManager\.[A-Za-z]+\.Tests).*$', '$1'
            $skip = [int]$c.total - [int]$c.executed
            $lines += "| $suite | $($c.passed) | $($c.failed) | $skip |"
            $passed += [int]$c.passed; $failed += [int]$c.failed; $skipped += $skip
          }
          $lines += "| **Total** | **$passed** | **$failed** | **$skipped** |"
          ("## Test results`n`n" + ($lines -join "`n")) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/e2e/**
          retention-days: 14

  # Early warning: the same test suites against the newest Caddy release. Failures here mean a new Caddy version changes
  # behaviour the product relies on: read its release notes before bumping CaddyVersion.Tested. Does not block the build.
  caddy-latest:
    name: Tests against the latest Caddy (informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: '3.13'

      - name: Install aioquic (HTTP/3 0-RTT test client)
        shell: pwsh
        run: |
          & '${{ steps.py.outputs.python-path }}' -m pip install --disable-pip-version-check --no-input 'aioquic==1.3.0'
          if ($LASTEXITCODE -ne 0) { throw 'pip install aioquic failed.' }

      - name: Download the latest Caddy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-caddy.ps1 -Which latest

      - name: Config and Platform tests
        shell: pwsh
        env:
          # CaddyPinE2ETests skips its "binary == CaddyVersion.Tested" assertion in this job.
          CPM_CADDY_CHANNEL: latest
          CPM_AIOQUIC_PYTHON: ${{ steps.py.outputs.python-path }}
          CPM_E2E_ARTIFACTS: ${{ github.workspace }}/TestResults/e2e
        run: |
          dotnet test tests/CaddyManager.Config.Tests -c Release -m:1 --filter "Category!=Network" --logger "trx" --results-directory TestResults --nologo
          $config = $LASTEXITCODE
          dotnet test tests/CaddyManager.Platform.Tests -c Release -m:1 --filter "Category!=Network&Category!=WindowsE2E&Category!=WindowsService" --logger "trx" --results-directory TestResults --nologo
          if ($config -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Tests fail against the latest Caddy release.' }

      - name: Upload test results (latest Caddy)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-caddy-latest
          path: |
            TestResults/*.trx
            TestResults/e2e/**
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build and package (windows)
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $base = (Select-Xml -LiteralPath Directory.Build.props -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1).Node.InnerText.Trim()
            $v = "$base-ci.${{ github.run_number }}"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Invalid version '$v'" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v"

      # Optional Authenticode signing: set the repository secrets SIGNING_CERT_BASE64 (the .pfx, base64 encoded, e.g.
      # [Convert]::ToBase64String([IO.File]::ReadAllBytes('codesign.pfx'))) and SIGNING_CERT_PASSWORD. Without them
      # (and on pull requests from forks, which get no secrets) the build is simply not signed.
      - name: Prepare code-signing certificate
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host 'SIGNING_CERT_BASE64 is not set: CaddyManager.exe and the MSI are not code-signed.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:SIGNING_CERT_BASE64 -replace '\s', '')))
          } catch {
            throw "SIGNING_CERT_BASE64 is not valid base64: $($_.Exception.Message)"
          }
          "CPM_SIGNING_CERT=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Code signing enabled: CaddyManager.exe is signed before packaging, the MSI after it is built.'

      - name: Build (web, publish, sign, MSI, zip)
        shell: pwsh
        env:
          CPM_SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        # Tests already ran in the "test" job.
        run: ./build.ps1 -Version '${{ steps.version.outputs.version }}' -SkipTests

      - name: Remove code-signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:CPM_SIGNING_CERT -and (Test-Path -LiteralPath $env:CPM_SIGNING_CERT)) {
            Remove-Item -LiteralPath $env:CPM_SIGNING_CERT -Force
          }

      - name: Check the zip distribution
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem -LiteralPath artifacts -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No zip in artifacts/.' }
          $entries = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          $entries | ForEach-Object { Write-Host "  $_" }
          foreach ($required in 'CaddyManager.exe', 'install.ps1', 'uninstall.ps1', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md') {
            if ($entries -notcontains $required) { throw "$($zip.Name) does not contain $required." }
          }
          if (-not ($entries | Where-Object { $_ -like 'docs/*.md' })) { throw "$($zip.Name) does not contain docs/*.md." }
          if ($env:CPM_SIGNING_CERT) {
            $sig = Get-AuthenticodeSignature -LiteralPath artifacts/publish/CaddyManager.exe
            if ($sig.Status -ne 'Valid') { throw "CaddyManager.exe signature status: $($sig.Status) $($sig.StatusMessage)" }
            Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          }

      # Installs the MSI on the (elevated, throw-away) runner and checks what Windows actually configured: launch
      # condition, custom action sequencing, delayed start, recovery actions + failure flag, firewall exception, shortcut,
      # crash recovery, repair keeping UI_PORT, and a clean uninstall.
      - name: MSI install / uninstall test
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath artifacts -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No MSI in artifacts/.' }
          ./installer/test-msi.ps1 -Msi $msi.FullName -UiPort 8181

      - name: Upload MSI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: |
            ${{ runner.temp }}/cpm-*.log
            ${{ runner.temp }}/cpm-msi-test.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: caddy-proxy-manager-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags for the changelog

      - uses: actions/download-artifact@v8
        with:
          name: caddy-proxy-manager-${{ needs.build.outputs.version }}
          path: dist

      - name: Release notes from commits
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          {
            echo "## What's changed"
            echo
            git log --no-merges --reverse --format="- [\`%h\`](https://github.com/${REPO}/commit/%H) %s" "$range"
            echo
            echo "## Downloads"
            echo
            echo "| File | Use |"
            echo "|---|---|"
            for f in dist/*.msi; do [ -e "$f" ] && echo "| \`$(basename "$f")\` | Windows installer (double-click, or \`msiexec /i $(basename "$f") /qn\`) |"; done
            for f in dist/*.zip; do [ -e "$f" ] && echo "| \`$(basename "$f")\` | Zip install: extract, then \`.\\install.ps1\` in an elevated PowerShell |"; done
            echo
            echo "After installing, open \`http://<server>:81/\` and paste the setup token from \`C:\\ProgramData\\CaddyProxyManager\\setup-token.txt\`."
            echo
            echo "<details><summary>SHA-256 checksums</summary>"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "</details>"
            echo
            if [ -n "$prev" ]; then
              echo "**Full changelog**: https://github.com/${REPO}/compare/${prev}...${TAG}"
            else
              echo "**Full changelog**: https://github.com/${REPO}/commits/${TAG}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: Caddy Proxy Manager v${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
